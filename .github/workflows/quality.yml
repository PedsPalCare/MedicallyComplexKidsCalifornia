name: Website quality gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and audit static output
        run: npm run build
      - name: Test structured content
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test core interactions and automated accessibility
        run: npm run test:e2e
